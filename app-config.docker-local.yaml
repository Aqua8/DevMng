# 로컬 전용 설정: 내 컴퓨터에서만 접속하는 Docker 실행에서 게스트 로그인을 허용한다.
#
# Backstage는 운영 모드(NODE_ENV=production)에서 게스트 로그인을 막는다. 이 설정이 그 제한을 푼다.
# 비밀번호 없는 로그인이므로 포트를 127.0.0.1 에만 열었을 때(docker-compose.yml)만 안전하다.
# 인터넷에서 접속할 수 있는 곳에 배포한다면 이 파일을 쓰지 말고 실제 인증으로 바꿔야 한다. (docs/docker.md)
auth:
  providers:
    guest:
      dangerouslyAllowOutsideDevelopment: true
