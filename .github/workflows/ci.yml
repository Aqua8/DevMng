name: CI

on:
  push:
    branches: [main]
  pull_request:

# 같은 브랜치에서 새 커밋이 오면 이전 실행은 취소한다
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# 읽기 권한만 준다 (토큰이 새도 저장소를 바꿀 수 없게)
permissions:
  contents: read

jobs:
  verify:
    name: 검증 (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24'] # package.json engines: "22 || 24"
    steps:
      # 액션은 태그가 아니라 커밋 해시로 고정한다 (공급망 공격 대비). 버전은 주석 참고
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node }}
          cache: yarn

      - name: 의존성 설치 (yarn.lock 고정)
        run: yarn install --immutable

      - name: 타입 검사
        run: yarn tsc

      - name: 린트
        run: yarn lint:all

      - name: 서식 검사
        run: yarn prettier:check

      - name: 단위 테스트
        run: yarn test
        env:
          CI: 'true'

      - name: 빌드
        run: yarn build:all
