apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: nestjs-service
  title: NestJS 서비스
  description: >-
    새 NestJS(TypeScript) 서비스의 뼈대를 만들어 GitHub 저장소로 올리고 카탈로그에 등록한다.
    health 엔드포인트, Jest 테스트, 멀티스테이지 Dockerfile, GitHub Actions CI가 들어 있다.
  tags:
    - nestjs
    - typescript
spec:
  owner: group:default/personal
  type: service

  parameters:
    - title: 서비스 정보
      required:
        - name
        - description
      properties:
        name:
          title: 이름
          type: string
          description: 소문자, 숫자, 하이픈만 쓴다 (3~39자, 영문 소문자로 시작). 저장소 이름과 패키지 이름이 된다.
          pattern: '^[a-z][a-z0-9-]{2,38}$'
          ui:autofocus: true
        description:
          title: 설명
          type: string
          description: 한 줄 설명. 카탈로그와 README에 들어간다.
          maxLength: 200
    - title: 저장소 위치
      required:
        - repoUrl
      properties:
        repoUrl:
          title: 저장소
          type: string
          description: 만들 GitHub 저장소 (소유자와 이름). 이름은 위의 서비스 이름과 같게 한다.
          ui:field: RepoUrlPicker
          ui:options:
            allowedHosts:
              - github.com

  steps:
    - id: fetch
      name: 뼈대 만들기
      action: fetch:template
      input:
        url: ./skeleton
        values:
          name: ${{ parameters.name }}
          description: ${{ parameters.description }}
          owner: group:default/personal
          destination: ${{ parameters.repoUrl | parseRepoUrl }}

    # GitHub 에 저장소를 만들려면 포털을 실행할 때 GITHUB_TOKEN 환경 변수(저장소 생성 권한)가 필요하다.
    # 비공개 저장소로 만든다.
    - id: publish
      name: GitHub 저장소 만들기
      action: publish:github
      input:
        allowedHosts:
          - github.com
        description: ${{ parameters.description }}
        repoUrl: ${{ parameters.repoUrl }}
        defaultBranch: main
        repoVisibility: private

    - id: register
      name: 카탈로그에 등록
      action: catalog:register
      input:
        repoContentsUrl: ${{ steps.publish.output.repoContentsUrl }}
        catalogInfoPath: /catalog-info.yaml

  output:
    links:
      - title: 저장소 열기
        url: ${{ steps.publish.output.remoteUrl }}
      - title: 카탈로그에서 보기
        icon: catalog
        entityRef: ${{ steps.register.output.entityRef }}
