name: CI

on:
  push:
    branches: [main]
  pull_request:

# 같은 PR 에서 새 커밋이 오면 이전 실행은 취소한다. main 의 실행은 취소하지 않는다(커밋마다 결과가 남아야 함)
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# 읽기 권한만 준다 (토큰이 새도 저장소를 바꿀 수 없게)
permissions:
  contents: read

jobs:
  verify:
    name: 검증 (Node ${{ matrix.node }})
    runs-on: ubuntu-24.04 # ubuntu-latest 는 2026-10-19부터 Ubuntu 26으로 바뀌므로 버전을 고정한다
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24'] # package.json engines: "22 || 24"
    steps:
      # 액션은 태그가 아니라 커밋 해시로 고정한다 (공급망 공격 대비). 버전은 주석 참고
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false # 이후 단계가 git 토큰을 갖지 않게 한다
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: yarn

      - name: 의존성 설치 (yarn.lock 고정)
        run: yarn install --immutable

      - name: 타입 검사
        run: yarn tsc

      - name: 서식 검사
        run: yarn prettier:check

      # 린트·테스트·빌드는 Turborepo 가 패키지별로 실행하고 결과를 .turbo 에 캐시한다.
      # 입력(소스, 설정, yarn.lock)이 같은 패키지는 이전 실행의 결과를 다시 쓴다.
      - name: Turborepo 캐시 복원
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo
          key: turbo-${{ matrix.node }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ matrix.node }}-

      - name: 린트·테스트·빌드 (Turborepo)
        run: yarn verify

  docker:
    name: Docker 이미지 빌드
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false # 이후 단계가 git 토큰을 갖지 않게 한다
      # 이미지가 만들어지는지만 확인한다 (올리지 않음)
      - name: 이미지 빌드
        run: docker build . -f packages/backend/Dockerfile -t devmng:ci
